name: Release Android

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to tauri.conf.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Persist NDK env for downstream steps
        run: |
          set -euo pipefail
          NDK_PATH="${ANDROID_HOME}/ndk/27.2.12479018"
          if [[ ! -d "$NDK_PATH" ]]; then
            echo "Expected NDK directory missing: $NDK_PATH" >&2
            ls -la "${ANDROID_HOME}/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Resolved NDK path: $NDK_PATH"

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable + aarch64-linux-android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Read version from tag (or tauri.conf.json)
        id: app_version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          version_pattern='^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          config_version=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          if [[ ! "$config_version" =~ $version_pattern ]]; then
            echo "tauri.conf.json has an invalid version format" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#android-v}"
          elif [[ -n "$DISPATCH_VERSION" ]]; then
            version="$DISPATCH_VERSION"
            tag="android-v${version}"
          else
            version="$config_version"
            tag="android-v${version}"
          fi
          if [[ ! "$version" =~ $version_pattern ]]; then
            echo "invalid version format" >&2
            exit 1
          fi
          if [[ "$version" != "$config_version" ]]; then
            echo "requested/tag version does not match src-tauri/tauri.conf.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets exist
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$KEYSTORE_B64" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$STORE_PW" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "$KEY_PW" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            printf 'Missing secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write key.properties
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function escapeJavaProperty(value) {
            let escaped = '';
            for (let index = 0; index < value.length; index += 1) {
              const code = value.charCodeAt(index);
              if (code === 0x5c) escaped += '\\\\';
              else if (code === 0x09) escaped += '\\t';
              else if (code === 0x0a) escaped += '\\n';
              else if (code === 0x0d) escaped += '\\r';
              else if (code === 0x0c) escaped += '\\f';
              else if (code === 0x20) escaped += '\\ ';
              else if (code === 0x3d) escaped += '\\=';
              else if (code === 0x3a) escaped += '\\:';
              else if (code === 0x23) escaped += '\\#';
              else if (code === 0x21) escaped += '\\!';
              else if (code < 0x20 || code > 0x7e) escaped += '\\u' + code.toString(16).padStart(4, '0');
              else escaped += String.fromCharCode(code);
            }
            return escaped;
          }

          const entries = [
            ['storeFile', path.join(process.env.RUNNER_TEMP, 'release.jks')],
            ['storePassword', process.env.STORE_PW],
            ['keyAlias', process.env.KEY_ALIAS],
            ['keyPassword', process.env.KEY_PW],
          ];
          if (entries.some(([, value]) => typeof value !== 'string')) {
            throw new Error('Required signing environment value is missing');
          }
          fs.writeFileSync(
            'src-tauri/gen/android/key.properties',
            `${entries.map(([key, value]) => `${key}=${escapeJavaProperty(value)}`).join('\n')}\n`,
            { encoding: 'ascii', mode: 0o600 },
          );
          NODE

      - name: Build Android APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ENABLE_DEMO_AUTH: ${{ vars.ENABLE_DEMO_AUTH }}
        run: npm run build:android

      - name: Ensure release exists and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.app_version.outputs.tag }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          set -euo pipefail
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "APK not found at $APK" >&2
            ls -R src-tauri/gen/android/app/build/outputs || true
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Android v${VERSION}" \
              --generate-notes \
              --latest=false
          fi
          gh release upload "$TAG" \
            "$APK#app-universal-release.apk" \
            --clobber
